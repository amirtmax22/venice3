plugins { id 'fabric-loom' version '1.9-SNAPSHOT' }

version = "1.0.0"
group = "ai.venice.trestage"
base { archivesName = "Trestage" }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.5+1.21.1"
}

sourceSets {
    main {
        java {
            srcDirs = [".", "core", "gui", "util",
                       "modules/combat", "modules/movement",
                       "modules/player", "modules/render"]
        }
        resources { srcDirs = ["src/main/resources"] }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
